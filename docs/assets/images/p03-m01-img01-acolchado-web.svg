<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Comparación de dos macetas, con y sin acolchado</title>
  <desc id="desc">Dos plantas iguales crecen en macetas. La primera tiene el suelo expuesto y pierde más agua; la segunda tiene una capa de acolchado que conserva humedad.</desc>
  <rect width="1200" height="680" rx="36" fill="#f5f0e4"/>
  <g font-family="Arial, sans-serif" fill="#183d31">
    <text x="300" y="76" text-anchor="middle" font-size="32" font-weight="700">Suelo expuesto</text>
    <text x="900" y="76" text-anchor="middle" font-size="32" font-weight="700">Con acolchado</text>
  </g>
  <g stroke="#285946" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M300 340 C260 280 245 220 250 150 M300 340 C340 280 355 220 350 150"/>
    <path d="M900 340 C860 280 845 220 850 150 M900 340 C940 280 955 220 950 150"/>
  </g>
  <g fill="#6d9b57">
    <ellipse cx="232" cy="170" rx="70" ry="34" transform="rotate(-28 232 170)"/><ellipse cx="365" cy="180" rx="70" ry="34" transform="rotate(28 365 180)"/>
    <ellipse cx="220" cy="245" rx="66" ry="32" transform="rotate(-20 220 245)"/><ellipse cx="380" cy="250" rx="66" ry="32" transform="rotate(20 380 250)"/>
    <ellipse cx="832" cy="170" rx="70" ry="34" transform="rotate(-28 832 170)"/><ellipse cx="965" cy="180" rx="70" ry="34" transform="rotate(28 965 180)"/>
    <ellipse cx="820" cy="245" rx="66" ry="32" transform="rotate(-20 820 245)"/><ellipse cx="980" cy="250" rx="66" ry="32" transform="rotate(20 980 250)"/>
  </g>
  <g>
    <path d="M115 335 H485 L440 610 H160 Z" fill="#c8794d"/>
    <path d="M715 335 H1085 L1040 610 H760 Z" fill="#c8794d"/>
    <path d="M130 350 H470 L455 425 H145 Z" fill="#806247"/>
    <path d="M730 350 H1070 L1055 425 H745 Z" fill="#806247"/>
    <path d="M735 340 H1065 L1057 380 H743 Z" fill="#b89058"/>
    <g fill="#d7b77a"><ellipse cx="780" cy="350" rx="35" ry="14"/><ellipse cx="850" cy="360" rx="42" ry="14"/><ellipse cx="930" cy="348" rx="38" ry="13"/><ellipse cx="1010" cy="359" rx="35" ry="14"/></g>
  </g>
  <g fill="none" stroke="#5aa5c6" stroke-width="9" stroke-linecap="round" opacity=".8">
    <path d="M180 385 C150 330 145 300 160 265"/><path d="M250 385 C220 320 225 285 240 255"/><path d="M380 385 C420 325 425 290 410 255"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="25" fill="#465e54">
    <text x="300" y="650" text-anchor="middle">La superficie queda expuesta</text>
    <text x="900" y="650" text-anchor="middle">La cubierta protege la humedad</text>
  </g>
</svg>
