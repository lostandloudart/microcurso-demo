<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Tres recorridos de diagnóstico del cultivo</title>
  <desc id="desc">Tres columnas diferencian plaga, enfermedad y trastorno según su origen: organismos, agentes patógenos o condiciones de cultivo.</desc>
  <rect width="1200" height="680" rx="36" fill="#f5f0e4"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 70)">
      <rect width="320" height="540" rx="28" fill="#fffdf8" stroke="#b8c9b3" stroke-width="3"/>
      <circle cx="160" cy="135" r="78" fill="#e7efd9"/>
      <path d="M160 190 C95 155 85 90 145 62 C195 90 222 132 160 190Z" fill="#79a35e"/>
      <circle cx="123" cy="111" r="12" fill="#513d2d"/><circle cx="158" cy="92" r="10" fill="#513d2d"/><circle cx="182" cy="132" r="13" fill="#513d2d"/>
      <text x="160" y="270" text-anchor="middle" font-size="34" font-weight="700" fill="#183d31">Plaga</text>
      <text x="160" y="330" text-anchor="middle" font-size="24" fill="#465e54">Insectos</text><text x="160" y="370" text-anchor="middle" font-size="24" fill="#465e54">Ácaros</text><text x="160" y="410" text-anchor="middle" font-size="24" fill="#465e54">Caracoles</text>
      <text x="160" y="495" text-anchor="middle" font-size="22" font-weight="700" fill="#8b5b3e">Buscar organismos</text>
    </g>
    <g transform="translate(440 70)">
      <rect width="320" height="540" rx="28" fill="#fffdf8" stroke="#b8c9b3" stroke-width="3"/>
      <circle cx="160" cy="135" r="78" fill="#e7efd9"/>
      <path d="M160 190 C95 155 85 90 145 62 C195 90 222 132 160 190Z" fill="#79a35e"/>
      <g fill="#d5b45a"><circle cx="125" cy="108" r="18"/><circle cx="164" cy="91" r="14"/><circle cx="185" cy="137" r="19"/><circle cx="145" cy="151" r="11"/></g>
      <text x="160" y="270" text-anchor="middle" font-size="34" font-weight="700" fill="#183d31">Enfermedad</text>
      <text x="160" y="330" text-anchor="middle" font-size="24" fill="#465e54">Hongos</text><text x="160" y="370" text-anchor="middle" font-size="24" fill="#465e54">Bacterias</text><text x="160" y="410" text-anchor="middle" font-size="24" fill="#465e54">Virus</text>
      <text x="160" y="495" text-anchor="middle" font-size="22" font-weight="700" fill="#8b5b3e">Observar alteraciones</text>
    </g>
    <g transform="translate(810 70)">
      <rect width="320" height="540" rx="28" fill="#fffdf8" stroke="#b8c9b3" stroke-width="3"/>
      <circle cx="160" cy="135" r="78" fill="#e7efd9"/>
      <path d="M160 190 C95 155 85 90 145 62 C195 90 222 132 160 190Z" fill="#9db47b"/>
      <path d="M190 62 C230 108 223 145 190 160 C157 143 150 106 190 62Z" fill="#5aa5c6"/>
      <text x="160" y="270" text-anchor="middle" font-size="34" font-weight="700" fill="#183d31">Trastorno</text>
      <text x="160" y="330" text-anchor="middle" font-size="24" fill="#465e54">Agua o suelo</text><text x="160" y="370" text-anchor="middle" font-size="24" fill="#465e54">Luz o helada</text><text x="160" y="410" text-anchor="middle" font-size="24" fill="#465e54">Viento o nutrientes</text>
      <text x="160" y="495" text-anchor="middle" font-size="22" font-weight="700" fill="#8b5b3e">Corregir el manejo</text>
    </g>
  </g>
</svg>
