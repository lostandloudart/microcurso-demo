<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Cálculo del rendimiento</title><desc id="d">Dos fórmulas convierten volumen a masa y la masa obtenida en porcentaje.</desc><rect width="1200" height="675" rx="36" fill="#edf2e8"/><g font-family="Arial" fill="#173b32"><text x="80" y="100" font-size="46" font-weight="700">DE LAS GOTAS AL PORCENTAJE</text><rect x="80" y="155" width="1040" height="160" rx="28" fill="#d9ac59"/><text x="600" y="220" text-anchor="middle" font-size="34" font-weight="700">DENSIDAD × VOLUMEN = MASA DE ACEITE</text><text x="600" y="275" text-anchor="middle" font-size="28">0,850 g/ml × 0,47 ml = 0,4 g</text><path d="M600 330v70" stroke="#173b32" stroke-width="12"/><rect x="80" y="400" width="1040" height="170" rx="28" fill="#9fc2ad"/><text x="600" y="465" text-anchor="middle" font-size="34" font-weight="700">MASA DE ACEITE ÷ MASA DE HIERBA × 100</text><text x="600" y="525" text-anchor="middle" font-size="28">0,4 g ÷ 80 g × 100 = 0,5 %</text></g></svg>
