<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Comparación de métodos de extracción</title><desc id="d">Cuatro columnas comparan vapor, disolventes, dióxido de carbono supercrítico y prensado.</desc><rect width="1200" height="675" rx="36" fill="#f4efe3"/><g font-family="Arial" fill="#173b32"><text x="65" y="80" font-size="42" font-weight="700">CUANDO DESTILAR NO ALCANZA</text><g font-size="28" font-weight="700" text-anchor="middle"><rect x="45" y="135" width="250" height="430" rx="28" fill="#bdd4c5"/><text x="170" y="195">VAPOR</text><text x="170" y="300" font-size="22">temperatura baja</text><text x="170" y="350" font-size="22">aceites esenciales</text><rect x="330" y="135" width="250" height="430" rx="28" fill="#e1b36a"/><text x="455" y="195">DISOLVENTE</text><text x="455" y="300" font-size="22">flores delicadas</text><text x="455" y="350" font-size="22">ceras y grasas</text><rect x="615" y="135" width="250" height="430" rx="28" fill="#9fc3b4"/><text x="740" y="195">CO₂</text><text x="740" y="300" font-size="22">alta presión</text><text x="740" y="350" font-size="22">equipo costoso</text><rect x="900" y="135" width="250" height="430" rx="28" fill="#d98a68"/><text x="1025" y="195">PRENSADO</text><text x="1025" y="300" font-size="22">acción mecánica</text><text x="1025" y="350" font-size="22">cáscaras</text></g></g></svg>
